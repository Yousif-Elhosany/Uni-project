<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>المتحف المصري الكبير</title>

<style>

body {
  margin: 0;
  font-family: Arial;
  transition: 0.5s;
}

/* دارك مود */
.dark {
  background: #111;
  color: white;
}

.dark .card {
  background: #222;
}

/* Navbar */
.navbar {
  background: brown;
  padding5px;
  text-align: center;
}

.navbar a {
  color: #ffffff;
  margin: 100px;
  text-decoration: none;
  font-weight: border-top-color;
}

/* زر الوضع */
.toggle {
  position: fixed;
  top: 10px;
  left: 10px;
  background: black;
  color: white;
  padding: 10px;
  cursor: pointer;
}

/* كروت */
.container {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
}

.card {
  background:#782b1c;
  margin: 50px;
  padding: 100px;
  border-radius: 50px;
  width: 500px;
  transition: 0.3s;
}

.card:hover {
  transform: scale(1.05);
}

</style>
</head>

<body>

<div class="toggle" onclick="toggleMode()">🌙</div>

<div class="navbar">
  <a href="index.html"><h2>الرئيسية</h2></a>
  <a href="Ticket.html"><h2>التذاكر</h2></a>
</div>

<div class="container">

<div class="card">
<a href="museum.html">
<h1>تاريخ المتحف</h1></a>
 <img src="sss.jpg">
</div>
</div>

<script>
function toggleMode(){
  document.body.classList.toggle("dark");
}
</script>

</body>
</html>
